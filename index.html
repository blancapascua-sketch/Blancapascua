<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blanca Pascua — Portfolio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff}
body{font-family:Georgia,"Times New Roman",serif}
button{font:inherit}
#portada{display:grid;place-items:center;width:100%;min-height:100svh;background:white;border:0;padding:2vmin;cursor:pointer}
#portada img{display:block;width:96vw;height:96svh;object-fit:contain}
#cine{display:none;position:fixed;inset:0;background:#080808;color:#f2eee4;align-items:center;justify-content:center;overflow:hidden}
body.iniciado #portada{display:none}
body.iniciado #cine{display:flex}
#cine::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.11;background:repeating-linear-gradient(90deg,transparent 0 83px,#fff 84px,transparent 85px 187px);animation:grano .25s steps(2) infinite}
@keyframes grano{50%{opacity:.05}}
.palabra{position:absolute;left:50%;top:50%;width:94%;transform:translate(-50%,-50%);text-align:center;font-family:"Bodoni MT",Didot,"Times New Roman",Georgia,serif;font-weight:400;font-size:clamp(29px,7vw,98px);letter-spacing:.045em;line-height:1.12;text-transform:uppercase;opacity:0;pointer-events:none}
.palabra.larga{font-size:clamp(24px,5.7vw,82px)}
body.iniciado .palabra{animation:titulo 1.5s ease-in-out both}
body.iniciado .palabra:nth-child(2){animation-delay:1.5s}
body.iniciado .palabra:nth-child(3){animation-delay:3s}
body.iniciado .palabra:nth-child(4){animation-delay:4.5s}
@keyframes titulo{0%{opacity:0}16%{opacity:1}72%{opacity:1}100%{opacity:0}}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(35px,7vh,90px);padding:12vh 8vw;opacity:0;visibility:hidden}
body.iniciado #menu{animation:mostrarMenu .45s ease 6s forwards}
@keyframes mostrarMenu{to{opacity:1;visibility:visible}}
#menu nav{display:flex;align-items:center;justify-content:center;gap:clamp(20px,4vw,60px);flex-wrap:wrap}
#menu a{color:inherit;text-decoration:none;text-transform:uppercase;letter-spacing:.12em;font-size:clamp(12px,1.3vw,18px);padding:10px 0;border-bottom:1px solid transparent}
#menu a:hover,#menu a:focus-visible{border-bottom-color:currentColor}
#secciones{display:none;background:#f5f3ef;color:#171717}
body.abierto #cine{display:none}
body.abierto #secciones{display:block}
#secciones section{min-height:100svh;padding:15vh 9vw;border-bottom:1px solid #ccc}
#secciones h2{font-size:clamp(32px,6vw,80px);font-weight:400}
#volver{position:fixed;top:20px;right:20px;background:#111;color:white;border:1px solid #aaa;padding:10px 15px;cursor:pointer;z-index:2}
#sobre-mi{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.lamina{display:block;width:min(100%,720px);border:0;padding:0;background:transparent;cursor:zoom-in}
.lamina img{display:block;width:100%;height:auto}
.ayuda{font-size:12px;letter-spacing:.08em;text-align:center}
#ampliacion{border:0;background:rgba(8,8,8,.97);color:white;width:100vw;height:100dvh;max-width:100vw;max-height:100dvh;margin:0;padding:70px 15px 30px;overflow:auto}
#ampliacion::backdrop{background:rgba(0,0,0,.9)}
#imagen-ampliada{display:block;width:90vw;max-width:none;height:auto;margin:0 auto}
#cerrar-ampliacion{position:fixed;top:15px;right:15px;padding:10px 14px;background:#fff;color:#111;border:0;cursor:pointer}
#controles{position:fixed;top:15px;left:15px;display:flex;gap:8px}
#controles button{padding:10px 15px;background:#fff;color:#111;border:0;cursor:pointer}
@media(max-width:600px){#menu nav{flex-direction:column;gap:16px}#menu{gap:40px}.palabra.larga{font-size:clamp(22px,5.8vw,38px)}#secciones section{padding:75px 12px 35px}}
</style>
</head>
<body>
<button id="portada" aria-label="Entrar en la web de Blanca Pascua"><img src="portada.png" alt="Portada amarilla original de Blanca Pascua"></button>
<div id="cine" aria-label="Presentación de Blanca Pascua">
<div class="palabra">BLANCA PASCUA</div>
<div class="palabra">ESTILISMO</div>
<div class="palabra larga">DIRECCIÓN CREATIVA</div>
<div class="palabra larga">IDENTIDAD VISUAL</div>
<div id="menu"><nav aria-label="Navegación"><a href="#sobre-mi">SOBRE MÍ</a><a href="#visto-de-revista">VISTO DE REVISTA</a><a href="#proposito-y-valores">PROPÓSITO Y VALORES</a></nav></div>
</div>
<main id="secciones">
<button id="volver" type="button">VOLVER</button>
<section id="sobre-mi"><button class="lamina" id="abrir-ampliacion" type="button" aria-label="Ampliar Sobre mí"><img src="sobre-mi.png" alt="Sobre mí: Blanca Pascua, estilismo y moda" loading="lazy"></button><p class="ayuda">PULSA LA IMAGEN PARA AMPLIARLA</p></section>
<section id="visto-de-revista"><h2>VISTO DE REVISTA</h2></section>
<section id="proposito-y-valores"><h2>PROPÓSITO Y VALORES</h2></section>
</main>
<dialog id="ampliacion" aria-label="Imagen Sobre mí ampliada"><div id="controles"><button type="button" id="mas" aria-label="Aumentar zoom">+</button><button type="button" id="menos" aria-label="Reducir zoom">−</button></div><button type="button" id="cerrar-ampliacion">CERRAR ×</button><img id="imagen-ampliada" src="sobre-mi.png" alt="Lámina Sobre mí completa"></dialog>
<script>
const portada=document.getElementById('portada');
portada.addEventListener('click',()=>document.body.classList.add('iniciado'));
document.querySelectorAll('#menu a').forEach(a=>a.addEventListener('click',()=>document.body.classList.add('abierto')));
document.getElementById('volver').addEventListener('click',()=>{document.body.classList.remove('abierto');location.hash='';});
const dialogo=document.getElementById('ampliacion');
const ampliada=document.getElementById('imagen-ampliada');
let zoom=1;
function cambiarZoom(nuevo){zoom=Math.max(.5,Math.min(3,nuevo));ampliada.style.width=(zoom*90)+'vw';}
document.getElementById('abrir-ampliacion').addEventListener('click',()=>{cambiarZoom(1);dialogo.showModal();});
document.getElementById('cerrar-ampliacion').addEventListener('click',()=>dialogo.close());
document.getElementById('mas').addEventListener('click',()=>cambiarZoom(zoom+.25));
document.getElementById('menos').addEventListener('click',()=>cambiarZoom(zoom-.25));
dialogo.addEventListener('click',e=>{if(e.target===dialogo)dialogo.close();});
</script>
</body>
</html>
