<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#0b0a09;color:#eee8db;font-family:Georgia,'Times New Roman',serif}button,a{font:inherit}
#intro{position:fixed;inset:0;z-index:10;background:#080808 url('marco-vintage.png') center center/100% 100% no-repeat;overflow:hidden;animation:exitIntro .35s ease 5.5s forwards;}

.word{position:absolute;top:49.5%;left:50%;transform:translate(-50%,-50%);margin:0;width:75%;text-align:center;color:#eee8db;font-family:'Bodoni MT','Didot','Times New Roman',serif;font-stretch:condensed;font-weight:400;font-size:clamp(27px,6.1vw,105px);letter-spacing:.045em;line-height:1.05;text-transform:uppercase;opacity:0;text-shadow:0 0 1px #f5f0e5;white-space:nowrap}
.word:nth-child(1){animation:show1 5.5s linear forwards}.word:nth-child(2){animation:show2 5.5s linear forwards}.word:nth-child(3){font-size:clamp(19px,5.2vw,88px);animation:show3 5.5s linear forwards}.word:nth-child(4){font-size:clamp(20px,5vw,85px);animation:show4 5.5s linear forwards}
@keyframes show1{0%,1%{opacity:0}3%,19%{opacity:1}22%,100%{opacity:0}}@keyframes show2{0%,25%{opacity:0}28%,44%{opacity:1}47%,100%{opacity:0}}@keyframes show3{0%,50%{opacity:0}53%,69%{opacity:1}72%,100%{opacity:0}}@keyframes show4{0%,75%{opacity:0}78%,94%{opacity:1}97%,100%{opacity:0}}@keyframes exitIntro{to{opacity:0;visibility:hidden;pointer-events:none}}@keyframes flicker{0%{opacity:.08}50%{opacity:.15}100%{opacity:.06}}
#site{min-height:100svh;background:#080808 url('marco-vintage.png') center center/100% 100% no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:17vh 12vw;gap:clamp(24px,6vh,70px)}
.site-name{font-weight:400;font-size:clamp(28px,6vw,88px);letter-spacing:.055em;margin:0;text-transform:uppercase;white-space:nowrap}.nav{display:flex;justify-content:center;gap:clamp(15px,3vw,55px);flex-wrap:wrap;max-width:750px}.nav a{color:#eee8db;text-decoration:none;font-size:clamp(10px,1.35vw,16px);letter-spacing:.13em;text-transform:uppercase;border-bottom:1px solid transparent;padding-bottom:6px}.nav a:hover,.nav a:focus-visible{border-color:currentColor}
section{min-height:55vh;background:#f0ede7;color:#171512;padding:90px max(8vw,25px);border-bottom:1px solid #bdb6a9}section:nth-of-type(even){background:#e6e1d8}section h2{font-size:clamp(28px,5vw,70px);font-weight:400;letter-spacing:.04em;margin:0;text-transform:uppercase}footer{padding:30px;text-align:center;font-size:12px;letter-spacing:.14em}
@media(max-width:650px){#intro,#site{background-size:100% 100%}.word{width:82%;font-size:clamp(23px,6.1vw,42px)}.word:nth-child(3),.word:nth-child(4){font-size:clamp(18px,4.9vw,34px)}#site{padding:15vh 10vw}.site-name{font-size:clamp(24px,6vw,42px)}.nav{flex-direction:column;gap:22px}}
@media(prefers-reduced-motion:reduce){#intro{animation:none;display:none}html{scroll-behavior:auto}}
