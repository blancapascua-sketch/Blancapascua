<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dirección Creativa — Blanca Pascua</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#000;font-family:'Courier New',monospace}header{position:sticky;top:0;background:#fff;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px 4vw;border-bottom:1px solid #000}header a{color:#000;text-decoration:none;font-size:12px}h1{font-size:clamp(13px,2vw,19px);font-weight:400;letter-spacing:.1em;text-align:center;margin:0}main{min-height:80svh;display:grid;place-items:center;padding:20px 4vw}.spread{display:flex;align-items:center;justify-content:center;gap:0;width:100%;max-width:1450px;min-height:65svh}.page{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;min-height:60svh}.page img{max-width:100%;max-height:76svh;width:auto;height:auto;object-fit:contain;display:block;cursor:zoom-in}.page:empty{display:none}.controls{display:flex;align-items:center;justify-content:center;gap:25px;padding:12px 0 30px}.controls button{background:#fff;color:#000;border:1px solid #000;padding:10px 18px;font:13px 'Courier New',monospace;cursor:pointer}.controls button:disabled{opacity:.25;cursor:default}#counter{font-size:12px;min-width:65px;text-align:center}#status{text-align:center;font-size:13px}dialog{border:0;padding:0;max-width:100vw;max-height:100svh;width:100vw;height:100svh;background:#fff}dialog img{width:100%;height:100%;object-fit:contain}dialog button{position:fixed;right:20px;top:20px;background:#fff;border:1px solid #000;padding:12px;font:12px 'Courier New',monospace;cursor:pointer}@media(max-width:650px){header{padding:15px 12px}h1{font-size:12px}.spread{flex-direction:column}.page{min-height:0;width:100%}.page img{max-height:68svh}.page:nth-child(2){display:none}main{padding:15px 10px;min-height:72svh}}
</style>
</head>
<body>
<header><a href="index.html">← VOLVER</a><h1>DIRECCIÓN CREATIVA</h1><span style="font-size:11px">BLANCA PASCUA</span></header>
<main><div id="status">CARGANDO PORTFOLIO…</div><div class="spread" id="spread" hidden><div class="page" id="left"></div><div class="page" id="right"></div></div></main>
<div class="controls"><button id="prev" aria-label="Página anterior">←</button><span id="counter">—</span><button id="next" aria-label="Página siguiente">→</button></div>
<dialog id="zoom"><button id="close">CERRAR ×</button><img id="large" alt="Fotografía ampliada"></dialog>
<script>
const owner='blancapascua-sketch',repo='Blancapascua',folder='direccion-creativa';
const base=`https://api.github.com/repos/${owner}/${repo}/contents/${folder}?ref=main`;
const spread=document.getElementById('spread'),status=document.getElementById('status'),left=document.getElementById('left'),right=document.getElementById('right');
const prev=document.getElementById('prev'),next=document.getElementById('next'),counter=document.getElementById('counter');
const zoom=document.getElementById('zoom'),large=document.getElementById('large');
let images=[],page=0;
function mobile(){return matchMedia('(max-width:650px)').matches}
function show(){const per=mobile()?1:2, total=Math.ceil(images.length/per);page=Math.max(0,Math.min(page,total-1));left.replaceChildren();right.replaceChildren();[left,right].forEach((el,i)=>{if(i>=per)return;const file=images[page*per+i];if(!file)return;const img=document.createElement('img');img.src=file.download_url;img.alt=file.name;img.loading='eager';img.addEventListener('click',()=>{large.src=img.src;large.alt=img.alt;zoom.showModal()});el.append(img)});counter.textContent=`${page+1} / ${total}`;prev.disabled=page===0;next.disabled=page>=total-1}
prev.addEventListener('click',()=>{page--;show()});next.addEventListener('click',()=>{page++;show()});document.getElementById('close').addEventListener('click',()=>zoom.close());zoom.addEventListener('click',e=>{if(e.target===zoom)zoom.close()});document.addEventListener('keydown',e=>{if(zoom.open)return;if(e.key==='ArrowRight'&&!next.disabled)next.click();if(e.key==='ArrowLeft'&&!prev.disabled)prev.click()});window.addEventListener('resize',()=>{page=0;if(images.length)show()});
fetch(base,{headers:{Accept:'application/vnd.github+json'}}).then(r=>{if(!r.ok)throw Error('No se ha podido acceder a las imágenes');return r.json()}).then(files=>{const seen=new Set();images=files.filter(f=>f.type==='file'&&/\.(png|jpe?g|webp|gif)$/i.test(f.name)).filter(f=>{if(seen.has(f.sha))return false;seen.add(f.sha);return true}).sort((a,b)=>a.name.localeCompare(b.name,'es',{numeric:true}));if(!images.length){status.textContent='TODAVÍA NO HAY IMÁGENES';return}status.hidden=true;spread.hidden=false;show()}).catch(()=>{status.textContent='NO SE HAN PODIDO CARGAR LAS IMÁGENES. COMPRUEBA QUE EL REPOSITORIO SEA PÚBLICO.'});
</script>
</body></html>
