<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Blanca Pascua — Portfolio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{background:#fff;font-family:Georgia,'Times New Roman',serif}
button{font:inherit}
#cover{width:100%;min-height:100svh;border:0;background:#fff;display:grid;place-items:center;padding:2vmin;cursor:pointer}
#cover img{width:96vw;height:96svh;object-fit:contain;display:block}
#cover:focus-visible,.menu a:focus-visible{outline:3px solid #a99c85;outline-offset:5px}
#cinema{display:none;position:fixed;inset:0;background:#050505;align-items:center;justify-content:center;padding:0;overflow:hidden}
body.playing #cover{display:none}
body.playing #cinema{display:flex}
.frame{position:relative;width:min(100vw,calc(100svh * 1536 / 953));aspect-ratio:1536/953;background:#070707 url('marco_original.png') center/100% 100% no-repeat;overflow:hidden}
#cardtitle{position:absolute;inset:37% 14% 40%;display:flex;align-items:center;justify-content:center;text-align:center;color:#e9e1d3;font-family:'Times New Roman',Georgia,serif;font-weight:400;font-size:clamp(16px,5.6vw,88px);line-height:1.03;letter-spacing:.015em;text-transform:uppercase;white-space:nowrap;opacity:0;transition:opacity .26s ease-in-out;text-shadow:0 0 1px #d9cfbc}
#cardtitle.visible{opacity:1}
#cardtitle.small{font-size:clamp(15px,4.6vw,72px)}
.menu{position:absolute;inset:36% 18% 37%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(9px,2.3vw,30px);opacity:0;visibility:hidden;transition:opacity .55s ease,visibility .55s ease}
.menu.visible{opacity:1;visibility:visible}
.menu a{color:#e9e1d3;text-decoration:none;text-align:center;text-transform:uppercase;font-family:'Times New Roman',Georgia,serif;font-size:clamp(15px,2.6vw,38px);letter-spacing:.06em;line-height:1.2}
.menu a:hover,.menu a:focus-visible{text-decoration:underline;text-underline-offset:7px}
.panel{display:none;position:fixed;inset:0;background:#f7f5f1;color:#161616;padding:clamp(24px,7vw,100px);overflow:auto;z-index:5}
.panel.active{display:block}
.panel h1{font-weight:normal;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(30px,6vw,72px)}
.panel p{font-size:18px;max-width:55ch;line-height:1.5}
.back{border:0;background:transparent;text-decoration:underline;cursor:pointer;padding:8px 0;text-transform:uppercase;letter-spacing:.08em}
@media(max-width:600px){#cardtitle{font-size:clamp(15px,5.6vw,36px)}#cardtitle.small{font-size:clamp(13px,4.7vw,30px)}.menu{gap:12px}.menu a{font-size:clamp(12px,2.9vw,20px)}}
</style>
</head>
<body>
<button id="cover" aria-label="Entrar al portfolio de Blanca Pascua"><img src="portada.png" alt="Portada de Blanca Pascua"></button>
<main id="cinema" aria-label="Presentación de Blanca Pascua"><div class="frame"><div id="cardtitle" aria-live="polite"></div><nav class="menu" id="menu" aria-label="Secciones del portfolio"><a href="#sobre-mi">Sobre mí</a><a href="#visto-de-revista">Visto de Revista</a><a href="#proposito-y-valores">Propósito y valores</a></nav></div></main>
<section class="panel" id="sobre-mi"><button class="back" type="button">← Volver al menú</button><h1>Sobre mí</h1><p>Próximamente.</p></section>
<section class="panel" id="visto-de-revista"><button class="back" type="button">← Volver al menú</button><h1>Visto de Revista</h1><p>Próximamente.</p></section>
<section class="panel" id="proposito-y-valores"><button class="back" type="button">← Volver al menú</button><h1>Propósito y valores</h1><p>Próximamente.</p></section>
<script>
(()=>{
 const cover=document.getElementById('cover'),title=document.getElementById('cardtitle'),menu=document.getElementById('menu');
 const names=['BLANCA PASCUA','ESTILISMO','DIRECCIÓN CREATIVA','IDENTIDAD VISUAL'];
 let timers=[]; const schedule=(fn,ms)=>timers.push(setTimeout(fn,ms));
 function start(){timers.forEach(clearTimeout);timers=[];document.body.classList.add('playing');menu.classList.remove('visible');title.classList.remove('visible');
 names.forEach((name,i)=>{const at=i*1250;
 schedule(()=>{title.textContent=name;title.classList.toggle('small',i>0);title.classList.add('visible')},at+80);
 schedule(()=>title.classList.remove('visible'),at+990);
 });
 schedule(()=>{title.classList.remove('visible');menu.classList.add('visible')},5500);
 }
 cover.addEventListener('click',start);
 function showPanel(){const id=decodeURIComponent(location.hash.slice(1));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===id));}
 window.addEventListener('hashchange',showPanel);document.querySelectorAll('.back').forEach(b=>b.addEventListener('click',()=>{location.hash='';document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'))}));showPanel();
})();
</script>
</body></html>
